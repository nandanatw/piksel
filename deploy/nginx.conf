# Nginx Configuration for Kreasya
# Copy this file to /etc/nginx/sites-available/kreasya on your VPS
# Then create symlink: ln -s /etc/nginx/sites-available/kreasya /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name your-domain.com;  # Ganti dengan domain atau IP VPS Anda

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Frontend static files
    location / {
        root /opt/kreasya/public;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        
        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            root /opt/kreasya/public;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    # API proxy to Node.js backend
    location /api {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Timeouts for long-running AI generation requests
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        proxy_send_timeout 300s;
    }

    # Max upload size for image references
    client_max_body_size 50M;
    client_body_timeout 300s;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    # Logs
    access_log /var/log/nginx/kreasya-access.log;
    error_log /var/log/nginx/kreasya-error.log;
}

