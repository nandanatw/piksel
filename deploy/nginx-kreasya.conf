# Kreasya — reverse proxy (isolated from other sites on this VPS, e.g. bandelbanget.shop).
# Install:
#   sudo cp deploy/nginx-kreasya.conf /etc/nginx/sites-available/kreasya.conf
#   sudo ln -s /etc/nginx/sites-available/kreasya.conf /etc/nginx/sites-enabled/kreasya.conf
#   sudo nginx -t && sudo systemctl reload nginx
# HTTPS (also rewrites this file to a 443 block):
#   sudo certbot --nginx -d kreasya.click -d www.kreasya.click -d app.kreasya.click -d admin.kreasya.click

server {
    listen 80;
    listen [::]:80;
    server_name kreasya.click www.kreasya.click app.kreasya.click admin.kreasya.click;

    # Match MAX_UPLOAD_BYTES (10 MB) so large reference images are rejected early.
    client_max_body_size 10m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://127.0.0.1:3456;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Auto-signup SSE stream: disable buffering, long read timeout.
    location = /api/pool/signup {
        proxy_pass http://127.0.0.1:3456;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3456;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
